<!DOCTYPE html>
<html lang="es">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #0b0b0b;
    color: #fff;
}

/* HERO */
.hero {
    height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url("https://images.unsplash.com/photo-1518091043644-c1d4457512c6")
        center / cover no-repeat;
}

.overlay {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.overlay h1 {
    font-size: 3rem;
    margin-bottom: 20px;
    animation: slideDown 1s ease;
}

.overlay p {
    font-size: 1.2rem;
    margin-bottom: 30px;
}

.btn {
    padding: 15px 30px;
    background: #e10600;
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
}

/* NAV */
.navbar {
    background: #111;
    padding: 20px;
    text-align: center;
    font-size: 1.5rem;
}

/* STADIUMS */
.stadiums {
    padding: 60px 10%;
}

.stadiums h2 {
    margin: 40px 0 20px;
    border-left: 5px solid #e10600;
    padding-left: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #151515;
    padding: 30px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 10px 20px rgba(225,6,0,0.4);
}

.card h3 {
    color: #e10600;
    margin-bottom: 10px;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: #111;
    padding: 30px;
    border-radius: 10px;
    max-width: 500px;
    width: 90%;
    animation: fadeIn 0.3s ease;
}

.modal-content h2 {
    color: #e10600;
    margin-bottom: 15px;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 28px;
    cursor: pointer;
}

/* FOOTER */
footer {
    background: #000;
    text-align: center;
    padding: 20px;
    margin-top: 50px;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}
<style>

<h3>Saitama Stadium</h3><p>Saitama, Japón</p></div>

<div class="card" data-title="Stade Mohamed V"

</section>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
    </div>
</div>

<footer>
    <p>© 2026 | Web de estadios de fútbol</p>
</footer>

<script>
const cards = document.querySelectorAll(".card");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modal-title");
const modalText = document.getElementById("modal-text");
const closeBtn = document.querySelector(".close");

cards.forEach(card => {
    card.addEventListener("click", () => {
        modalTitle.innerText = card.dataset.title;
        modalText.innerText = card.dataset.info;
        modal.style.display = "flex";
    });
});

closeBtn.onclick = () => modal.style.display = "none";
window.onclick = e => { if (e.target === modal) modal.style.display = "none"; };
</script>

</body>
</html>
